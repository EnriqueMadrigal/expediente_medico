<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0">Agregar Enfermedad</h1>
          </div><!-- /.col -->
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="#">Home</a></li>
            </ol>
          </div><!-- /.col -->
        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </div>
    <!-- /.content-header -->

<div class="card-body">

    <form [formGroup]="enfermedadForm" (ngSubmit)="onSubmit()">


    <div class="row g-3 mb-4">

          <div class="col-md-2">
            <label class="form-label">Tipo de Enfermedad:  </label><br />
            <select class="form-select" formControlName="id_enfermedad" name="id_enfermedad"  (change)="onEnfermedadChange($event)">
                 @for (item of componentText7(); track $index) {
              <option [value]="item.valueId">{{ item.textValue }}</option>
                    } 
            </select>
            
           

           </div>

             <div class="col-md-2">
            <label class="form-label">Enfermedad:  </label><br />
            <select class="form-select" formControlName="id_tipo_enfermedad" name="id_tipo_enfermedad">
                 @for (item of tipoEnfermedad(); track $index) {
              <option [value]="item.valueId">{{ item.textValue }}</option>
                    } 
            </select>

           </div>

    </div>

    <div class="row g-3 mb-4">


            <div class="col-md-2">
            <label class="form-label">Año de diagnostico:</label>
            <input type="date" class="form-control" formControlName="fecha">
          </div>

 <div class="col-md-2">
    <label class="form-label">Tiempo de evolución:</label><br />
            <input type="text" class="form-control" formControlName="tiempo_evolucion" name="tiempo_evolucion" placeholder="Otra">
        

      </div>

      <div class="col-md-2">
         <label class="form-label">Tratamiento actual:</label><br />
            <input type="text" class="form-control" formControlName="tratamiento" name="tratamiento" placeholder="Otra">
  
      </div>
        </div>

         <div class="row g-3 mb-4">
            <div class="col-md-2">
               <label class="form-label">Control:  </label><br />
            <select class="form-select" formControlName="id_control" name="id_control">
                 @for (item of componentText6(); track $index) {
              <option [value]="item.valueId">{{ item.textValue }}</option>
                    } 
            </select>
            </div>

             <div class="col-md-2">
            <label class="form-label">Último control:</label>
            <input type="date" class="form-control" formControlName="ultimo_control" name="ultimo_control">
          </div>

          <div class="col-md-2">
            <label class="form-label">Proximo control:</label>
            <input type="date" class="form-control" formControlName="proximo_control" name="proximo_control">
          </div>

           </div>

                 <div class="row g-3 mb-4">

             <div class="col-md-3">
         <label class="form-label">Complicaciones:</label><br />
            <input type="text" class="form-control" formControlName="complicaciones" name="complicaciones" placeholder="Otra">
  
      </div>

           </div>

           <div class="row g-3 mb-4">
<div class="col-md-6">

 <div class="d-grid gap-2 d-md-flex justify-content-md-end">
          <button type="button" class="btn btn-secondary me-md-2" (click)="clickCancel()">Cancelar</button>
          &nbsp;&nbsp;&nbsp;
          <button type="submit" class="btn btn-primary">
            Guardar enfermedad
            <span class="spinner-border spinner-border-sm" aria-hidden="true" [hidden]="!isLoading"></span> 
          </button>
        </div>
</div>
</div>


        </form>
</div>
