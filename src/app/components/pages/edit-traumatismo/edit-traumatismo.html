<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0">Editar Traumatismo</h1>
          </div><!-- /.col -->
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="#">Home</a></li>
            </ol>
          </div><!-- /.col -->
        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </div>
    <!-- /.content-header -->

<div class="card-body">

 

  
 <div class="row g-3 mb-4">
     
  <div class="col-md-3">
      <label class="form-label">¿Ha tenido algún traumatismo?<span class="text-danger">* &nbsp;</span></label>
    <input
      id="chkSwitch"
      class="form-control"
      type="checkbox"
      data-toggle="switchbutton"
      data-onlabel="Sí"
      data-offlabel="No"
      data-size="sm"
      data-onstyle="success"
      data-offstyle="danger"
       (change)="mostrarTrauma($event)"
       checked
       >

 </div>



  </div>


@if(showTrauma) {

 <form [formGroup]="traumaForm" (ngSubmit)="onSubmit()">

<div class="row g-3 mb-4">

          <div class="col-md-2">
            <label class="form-label">Tipo de traumatismo:  </label><br />
            <select class="form-select" formControlName="id_trauma" name="id_trauma">
                 @for (item of componentText1(); track item.Id) {
              <option [value]="item.valueId">{{ item.textValue }}</option>
                    } 
            </select>
          </div>

<div class="col-md-3">
            <label class="form-label">Otro traumatismo <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="trauma">
          </div>

        </div>


<div class="row g-3 mb-4">
  <div class="col-md-4">
            <label class="form-label">Zona Afectada <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="zona_afectada">
          </div>

 </div>


 <div class="row g-3 mb-4">
          <div class="col-md-3">
            <label class="form-label">Fecha:</label>
            <input type="date" class="form-control" formControlName="fecha">
          </div>
        </div>

<div class="row g-3 mb-4">
  <div class="col-md-6">
<h5 class="text-secondary border-bottom pb-2 mb-3">Tratamiento recibido: </h5>
</div>
</div>


<div class="row g-3 mb-4">

          <div class="col-md-2">
            <label class="form-label">Tipo de tratamiento </label><br />
            <select class="form-select" formControlName="id_tratamiento" name="id_tratamiento">
                 @for (item of componentText2(); track item.Id) {
              <option [value]="item.valueId">{{ item.textValue }}</option>
                    } 
            </select>
          </div>

<div class="col-md-3">
            <label class="form-label">Otro <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="tratamiento">
          </div>

        </div>

<div class="row g-3 mb-4">
  <div class="col-md-6">
  <h5 class="text-secondary border-bottom pb-2 mb-3">Secuelas</h5>
  </div>
</div>


<div class="row g-3 mb-4">
  
     
  <div class="col-md-4">
    <label class="form-label">¿Quedaron secuelas?</label>
     
    <input
         class="form-control"
      formControlName="secuelas"
      type="checkbox"
      style ="width: 20% !important; height: 50% !important;"
      data-onlabel="Sí"
      data-offlabel="No"
      data-size="sm"
      data-onstyle="success"
      data-offstyle="danger" checked>
 </div>

</div>

<div class="row g-3 mb-4">


 <div class="col-md-2">
            <label class="form-label">Secuela:  </label><br />
            <select class="form-control" formControlName="id_secuela" name="id_secuela">
                 @for (item of componentText3(); track item.Id) {
              <option [value]="item.valueId">{{ item.textValue }}</option>
                    } 
            </select>
          </div>

     

<div class="col-md-3">
            <label class="form-label">Otro tipo secuela <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="secuela">
          </div>

        </div>


<div class="row g-3 mb-4">
  <div class="col-md-6">
  <h5 class="text-secondary border-bottom pb-2 mb-3">Observaciones</h5>
  </div>
</div>


<div class="row g-3 mb-4">
<div class="col-md-3">
<textarea placeholder="observaciones" formControlName="observaciones" cols="60" rows="3" required></textarea>
</div>
</div>

<div class="row g-3 mb-4">
<div class="col-md-6">

 <div class="d-grid gap-2 d-md-flex justify-content-md-end">
          <button type="button" class="btn btn-secondary me-md-2" (click)="clickCancel()">Cancelar</button>
          &nbsp;&nbsp;&nbsp;
          <button type="submit" class="btn btn-primary">
            Guardar traumatismo
            <span class="spinner-border spinner-border-sm" aria-hidden="true" [hidden]="!isLoading"></span> 
          </button>
        </div>
</div>
</div>

</form>
}
@else {

<div class="row g-3 mb-4">
<div class="col-md-2">

 <div class="d-grid gap-2 d-md-flex justify-content-md-end">
          <button type="button" class="btn btn-primary me-md-2" (click)="clickCancel()">Continuar</button>
</div>
</div>          &nbsp;&nbsp;&nbsp;
</div>

}

</div>
