<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0">Editar Enfermedades</h1>
          </div><!-- /.col -->
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="#">Home</a></li>
            </ol>
          </div><!-- /.col -->
        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </div>
    <!-- /.content-header -->

<div class="card-body">


<form [formGroup]="enfermedadesForm" (ngSubmit)="onSubmit()">

<div class="row g-3 mb-4">

          <div class="col-md-2">
            <label class="form-label">Enfermedad Cardiovascular:  </label><br />
            <select class="form-select" formControlName="id_cardio" name="id_cardio">
                 @for (item of componentText1(); track $index) {
              <option [value]="item.valueId">{{ item.textValue }}</option>
                    } 
            </select>
            <br />
            <label class="form-label">Otro:  </label><br />
            <input type="text" class="form-control" formControlName="otro_cardio" name="otro_cardio" placeholder="Otra">


          </div>

           <div class="col-md-2">
            <label class="form-label">Metabolicas y endocrinas:  </label><br />
            <select class="form-select" formControlName="id_metabolismo" name="id_metabolismo">
                 @for (item of componentText2(); track $index) {
              <option [value]="item.valueId">{{ item.textValue }}</option>
                    } 
            </select>

            <br />
            <label class="form-label">Otro:  </label><br />
            <input type="text" class="form-control" formControlName="otro_metabolismo" name="otro_metabolismo" placeholder="Otra">
          </div>


  <div class="col-md-2">
            <label class="form-label">Respiratorias:  </label><br />
            <select class="form-select" formControlName="id_respiratorio" name="id_respiratorio">
                 @for (item of componentText3(); track $index) {
              <option [value]="item.valueId">{{ item.textValue }}</option>
                    } 
            </select>

            <br />
            <label class="form-label">Otro:  </label><br />
            <input type="text" class="form-control" formControlName="otro_respiratorio" name="otro_respiratorio" placeholder="Otra">
          </div>




        </div>


 
</form>

</div>
